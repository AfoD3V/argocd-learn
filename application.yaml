apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AfoD3V/argocd-learn.git
    targetRevision: HEAD
    path: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: myapp

  SyncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true